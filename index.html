<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML/CSS/JS Boilerplate</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <h1 id="greetings">Hola Amigo!</h1>
    </nav>

    <main>
      <h3>Enter your password</h3>

      <section class="candidate-section">
        <img
          src="https://images.pexels.com/photos/35555305/pexels-photo-35555305.jpeg"
          id="candidatPhoto"
          alt="Candidate Photo"
        />
        <section class="candidate-details">
          <p id="candidateOccupation">Business Accountant</p>
          <p id="candidateName">Sarah Bills</p>
        </section>
      </section>

      <section class="password-section">
        <form>
          <label for="password" id="passwordTitle">Password</label>
          <div class="passwordBox">
            <img src="/padlock.png" alt="" />
          </div>
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
